name: anvil

# `docker compose up -d --wait` brings up the whole product: database, queue,
# migrations, API, worker, dashboard. That is the only install path there is
# (ADR-0019 — no hosted tier), so it has to work on a fresh clone with no manual
# steps. `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d`
# adds the production hardening; see that file.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: anvil
      POSTGRES_PASSWORD: anvil
      POSTGRES_DB: anvil
    ports:
      # Loopback only. The host needs this for psql and the test suite, but
      # `5432:5432` binds 0.0.0.0 — an open Postgres with the password `anvil` on
      # every interface the machine has. Nothing inside compose uses this mapping;
      # services reach each other by service name over the compose network.
      #
      # **Both loopback stacks, and that is not redundant.** Binding IPv4 alone
      # made every `localhost` connection from a Windows host take ~2 s: the
      # resolver returns `::1` first, nothing is listening there, and the client
      # waits out a connect timeout before retrying 127.0.0.1. It turned the test
      # suite's per-test Redis reconnect into 2 s of dead time and the worker suite
      # from 1 minute into 10.
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anvil -d anvil"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    # AOF persistence: buffered-but-unpersisted traces must survive a Redis
    # restart or ingestion's zero-loss guarantee is void (ADR-0002).
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Loopback only — same reasoning as postgres above, both stacks for the same
      # reason. Redis has no password at all, so the binding matters more here.
      - "127.0.0.1:6379:6379"
      - "[::1]:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot schema migration, and the reason `compose up` works on a clean
  # volume at all — nothing else ran Alembic, so a fresh clone previously came up
  # with an API and no tables.
  #
  # A separate service rather than an API entrypoint step, for two reasons: it
  # runs exactly once however many API replicas start (concurrent `alembic
  # upgrade` on one database is a race nobody wants to debug), and a failed
  # migration is then visible as a failed container instead of a crash-looping
  # API.
  migrate:
    build: apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://anvil:anvil@postgres:5432/anvil
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: apps/api
      args:
        # `[otel]` pulls in the OpenTelemetry packages. Kept on by default so the
        # observability profile works without a rebuild; the exporter itself stays
        # inert unless OTEL_EXPORTER_OTLP_ENDPOINT is set below.
        API_EXTRAS: ${API_EXTRAS:-[otel]}
    environment:
      DATABASE_URL: postgresql+asyncpg://anvil:anvil@postgres:5432/anvil
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self_hosted}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # Reported to the usage panel, never acted on by the API — the worker owns
      # deletion (ADR-0022). Unset means keep everything.
      RETENTION_DAYS: ${RETENTION_DAYS:-}
      # Tracing Anvil's own request path (plan/observability.md §4). Unset by
      # default, which switches it off; the observability overlay sets it.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: anvil-api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: apps/worker
      args:
        # `[otel]` for tracing. `[judges]` is *not* default: three provider SDKs
        # for a feature many installs never use. Set WORKER_EXTRAS=[judges,otel]
        # to build an image that can run LLM graders.
        WORKER_EXTRAS: ${WORKER_EXTRAS:-[otel]}
    environment:
      DATABASE_URL: postgresql+asyncpg://anvil:anvil@postgres:5432/anvil
      REDIS_URL: redis://redis:6379/0
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self_hosted}
      RETENTION_DAYS: ${RETENTION_DAYS:-}
      # Judge providers. Only needed for LLM-backed graders, and the image needs
      # building with WORKER_EXTRAS=[judges] for them to be importable.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: anvil-worker
    # No published port: with replicas a fixed host port collides, and Prometheus
    # reaches 9101 over the compose network by DNS anyway.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: apps/web
    environment:
      # Where the *web server* reaches the API, not the browser — the browser goes
      # through the /api rewrite so the session cookie stays first-party.
      WEB_API_BASE_URL: ${WEB_API_BASE_URL:-http://api:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Self-observability (plan/observability.md) ── docker compose --profile observability up
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"   # 3000 is taken by web
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.5.0
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./infra/observability/tempo.yml:/etc/tempo.yml:ro
      - tempodata:/var/tempo
    ports:
      # Grafana reaches Tempo over the compose network, so this is only for
      # querying it directly — which is exactly what verifying an end-to-end trace
      # needs, and what was missing when that verification was first attempted.
      - "127.0.0.1:3200:3200"
      - "[::1]:3200:3200"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ./infra/observability/otel-collector.yml:/etc/otel-collector.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  grafanadata:
  tempodata:
