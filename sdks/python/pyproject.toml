[project]
name = "anvil-sdk"
version = "0.1.0"
description = "Anvil Python SDK — trace instrumentation for LLM apps"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.scripts]
anvil = "anvil_sdk.cli:main"

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
# The CLI works without PyYAML by reading JSON-in-.yaml; this makes real YAML
# (comments, block strings for prompts) available for the CI gate.
cli = ["pyyaml>=6"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "jsonschema>=4.21",
  "langchain-core>=0.2",
  "pyyaml>=6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anvil_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
