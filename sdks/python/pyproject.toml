[project]
name = "anvil-sdk"
version = "0.0.1"
description = "Anvil Python SDK — trace instrumentation for LLM apps (Phase 3, plan/sdk.md)"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anvil_sdk*"]
