[project]
name = "anvil-demo-rag-app"
version = "0.1.0"
description = "Anvil demo: a tiny instrumented FastAPI RAG app + trace generator"
requires-python = ">=3.10"
dependencies = [
  "anvil-sdk",
  "langchain-core>=0.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
real-llm = ["langchain-anthropic>=0.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
