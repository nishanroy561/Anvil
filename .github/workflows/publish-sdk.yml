# Publishes the Python SDK (sdks/python) to PyPI via Trusted Publishing.
#
# Release: bump `version` in sdks/python/pyproject.toml and `__version__` in
# anvil_sdk/__init__.py, merge to main, then:
#   git tag sdk-py-v0.1.0 && git push origin sdk-py-v0.1.0
#
# No API token is stored anywhere: PyPI trusts this exact file in this repo,
# running in the `pypi` environment (configured on pypi.org).
name: publish-sdk

on:
  push:
    tags: ["sdk-py-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#sdk-py-v}"
          pkg=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('anvil_sdk/__init__.py').read()).group(1))")
          echo "tag=$tag pyproject=$pkg __init__=$init"
          [ "$tag" = "$pkg" ] && [ "$tag" = "$init" ] || { echo "::error::version mismatch"; exit 1; }

      - name: Test
        run: |
          pip install -e ".[dev]"
          python -m pytest -q

      - name: Build
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdks/python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/anvil-sdk
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
