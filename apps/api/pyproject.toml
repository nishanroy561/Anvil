[project]
name = "anvil-api"
version = "0.1.0"
description = "Anvil API — LLM observability + evaluation platform (ingestion, query, eval APIs)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.2",
    "redis>=5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<4.1",  # passlib 1.7.4 reads __about__, removed in bcrypt 4.1
    "itsdangerous>=2.2",
    "jsonschema>=4.22",
    "prometheus-fastapi-instrumentator>=7.0",
    "prometheus-client>=0.20",  # metrics.py declares series directly
    "numpy>=1.26",  # paired bootstrap in services/analysis.py (ADR-0008)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=1.0",  # session loop-scope config keys
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anvil_api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session: the app builds its SQLAlchemy engine and
# Redis pool at import time, and those connections are bound to the loop that
# created them. Per-test loops would hand the second test a dead pool.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 100
