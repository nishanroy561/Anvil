[project]
name = "anvil-api"
version = "0.1.0"
description = "Anvil API — LLM observability + evaluation platform (ingestion, query, eval APIs)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.2",
    "redis>=5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<4.1",  # passlib 1.7.4 reads __about__, removed in bcrypt 4.1
    "itsdangerous>=2.2",
    "jsonschema>=4.22",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anvil_api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
