[project]
name = "anvil-worker"
version = "0.1.0"
description = "Anvil background workers: ingest consumer, eval runner, sampler, alerter, retention"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "prometheus-client>=0.20",
    "croniter>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=1.0", "ruff>=0.4"]
# LLM judge providers (ADR-0016). Optional because the test suite runs keyless
# with faked models; only a deployment running judged evals needs these, and
# then only the one for its provider. Imported lazily in providers.py, so a
# missing package is a per-item grader error, not an import failure.
judges = [
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-groq>=0.2",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anvil_worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One loop per session: the engine is built at import time and its pool is
# bound to the loop that created it (same reasoning as apps/api).
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 100
