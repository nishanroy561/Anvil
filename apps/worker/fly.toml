app = "anvil-worker"
primary_region = "bom"   # Mumbai — matches Upstash Redis region

[build]
  dockerfile = "Dockerfile"

# Worker has no public HTTP — it consumes Redis streams and writes to Postgres.
# It exposes port 9101 for Prometheus metrics only (internal).

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
